syntax = "proto2";

option java_package = "com.cowlark.fluxengine.encoders";

import "com/cowlark/fluxengine/arch/agat/agat.proto";
import "com/cowlark/fluxengine/arch/amiga/amiga.proto";
import "com/cowlark/fluxengine/arch/apple2/apple2.proto";
import "com/cowlark/fluxengine/arch/brother/brother.proto";
import "com/cowlark/fluxengine/arch/c64/c64.proto";
import "com/cowlark/fluxengine/arch/ibm/ibm.proto";
import "com/cowlark/fluxengine/arch/macintosh/macintosh.proto";
import "com/cowlark/fluxengine/arch/micropolis/micropolis.proto";
import "com/cowlark/fluxengine/arch/northstar/northstar.proto";
import "com/cowlark/fluxengine/arch/tartu/tartu.proto";
import "com/cowlark/fluxengine/arch/tids990/tids990.proto";
import "com/cowlark/fluxengine/arch/victor9k/victor9k.proto";

message EncoderProto
{
    oneof format
    {
        IbmEncoderProto ibm = 3;
        BrotherEncoderProto brother = 4;
        AmigaEncoderProto amiga = 5;
        MacintoshEncoderProto macintosh = 6;
        Tids990EncoderProto tids990 = 7;
        Commodore64EncoderProto c64 = 8;
        NorthstarEncoderProto northstar = 9;
        MicropolisEncoderProto micropolis = 10;
        Victor9kEncoderProto victor9k = 11;
        Apple2EncoderProto apple2 = 12;
        AgatEncoderProto agat = 13;
        TartuEncoderProto tartu = 14;
    }
}
